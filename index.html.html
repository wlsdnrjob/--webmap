<style>
  :root{
    --header-bg:#1f2937;
    --header-fg:#f8fafc;
    --panel-bg:#ffffff;
    --panel-border:#e2e8f0;
    --text-muted:#64748b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;}
  header{
    height:56px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 20px;
    background:var(--header-bg);
    color:var(--header-fg);
  }
  header h1{font-size:16px;font-weight:600;margin:0;}
  header p{font-size:12px;margin:0;color:#cbd5e1;}
  #map{position:absolute;top:56px;left:0;right:0;bottom:0;}
  .legend{
    background:var(--panel-bg);
    border:1px solid var(--panel-border);
    border-radius:6px;
    padding:10px 12px;
    font-size:12px;
    color:#1e293b;
    box-shadow:0 1px 4px rgba(0,0,0,0.15);
    line-height:1.4;
  }
  .legend-title{font-weight:600;margin-bottom:6px;}
  .legend-bar{
    width:140px;
    height:10px;
    border-radius:4px;
    background:linear-gradient(to right, rgb(255,255,0), rgb(255,0,0));
    margin-bottom:4px;
  }
  .legend-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);}
  .leaflet-popup-content b{color:#b91c1c;}

  /* ===== [추가] 적합도 필터 슬라이더 패널 스타일 ===== */
  .filter-control{width:170px;}
  .filter-control input[type="range"]{width:100%;margin:2px 0 6px;}
  .filter-control #suitabilityFilterValue{font-weight:600;color:#1e293b;}
</style>

// 색상 판정에 사용하는 실제 필드명 (요청서의 [필드명] 자리)
const SCORE_FIELD = 'suitability';

// 필드가 0~1 범위의 점수라는 전제에 따라, 데이터의 실제 min/max가 아니라
// 고정된 0~1 정의역을 기준으로 색상을 정규화합니다.
const SCORE_MIN = 0;
const SCORE_MAX = 1;

function getColor(value) {
  if (typeof value !== 'number') return '#9ca3af'; // 값이 없는 경우 회색
  const t = Math.max(0, Math.min(1, (value - SCORE_MIN) / (SCORE_MAX - SCORE_MIN)));
  const r = 255;
  const g = Math.round(255 * (1 - t)); // 노랑(255,255,0) -> 빨강(255,0,0)
  const b = 0;
  return `rgb(${r}, ${g}, ${b})`;
}

// ===== [추가] 기준값 필터용 투명도 설정값 =====
// 기준값 이상: 기존과 동일한 진한 표시 / 기준값 미만: 흐리게(투명하게) 표시
const NORMAL_FILL_OPACITY = 0.85;
const DIMMED_FILL_OPACITY = 0.1;
const NORMAL_BORDER_OPACITY = 1;
const DIMMED_BORDER_OPACITY = 0.25;

// ===== [추가] 슬라이더 조작 시 다시 찾아 투명도를 바꿀 수 있도록
//              마커와 해당 적합도 값을 함께 보관하는 목록 =====
const markerList = []; // { layer, value }

const map = L.map('map');

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  maxZoom: 20,
  subdomains: 'abcd',
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
}).addTo(map);

const geoLayer = L.geoJSON(resultGeoJSON, {
  pointToLayer: function (feature, latlng) {
    const value = feature.properties[SCORE_FIELD];
    return L.circleMarker(latlng, {
      radius: 7,
      fillColor: getColor(value),
      color: '#ffffff',
      weight: 1,
      opacity: 1,
      fillOpacity: 0.85
    });
  },
  onEachFeature: function (feature, layer) {
    const value = feature.properties[SCORE_FIELD];
    const display = (typeof value === 'number') ? value.toFixed(3) : '값 없음';
    layer.bindPopup(`<b>적합도 점수 (${SCORE_FIELD})</b><br>${display}`);

    // [추가] 슬라이더 필터가 나중에 이 마커의 투명도를 바꿀 수 있도록 등록
    markerList.push({ layer: layer, value: value });
  }
}).addTo(map);

if (geoLayer.getLayers().length > 0) {
  map.fitBounds(geoLayer.getBounds(), { padding: [20, 20] });
} else {
  map.setView([37.65, 127.06], 13); // 데이터가 비어 있을 때의 대체 좌표 (노원구 인근)
}

// 범례
const legend = L.control({ position: 'bottomright' });
legend.onAdd = function () {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = `
    <div class="legend-title">적합도 점수</div>
    <div class="legend-bar"></div>
    <div class="legend-scale"><span>0 (낮음)</span><span>1 (높음)</span></div>
  `;
  return div;
};
legend.addTo(map);

// ===== [추가] 적합도 기준값 필터 슬라이더 컨트롤 =====
const filterControl = L.control({ position: 'topright' });
filterControl.onAdd = function () {
  const div = L.DomUtil.create('div', 'legend filter-control');
  div.innerHTML = `
    <div class="legend-title">기준값 미만은 흐리게</div>
    <input type="range" id="suitabilityFilter" min="0" max="1" step="0.01" value="0" />
    <div class="legend-scale">
      <span>기준값</span><span id="suitabilityFilterValue">0.00</span>
    </div>
  `;
  // 슬라이더를 드래그할 때 지도가 함께 드래그/줌되지 않도록 이벤트 전파 차단
  L.DomEvent.disableClickPropagation(div);
  L.DomEvent.disableScrollPropagation(div);
  return div;
};
filterControl.addTo(map);

// ===== [추가] 기준값보다 낮은 포인트를 흐리게(투명하게) 처리하는 함수 =====
function applySuitabilityFilter(threshold) {
  markerList.forEach(function (item) {
    const belowThreshold = (typeof item.value !== 'number') || (item.value < threshold);
    item.layer.setStyle({
      fillOpacity: belowThreshold ? DIMMED_FILL_OPACITY : NORMAL_FILL_OPACITY,
      opacity: belowThreshold ? DIMMED_BORDER_OPACITY : NORMAL_BORDER_OPACITY
    });
  });
}

// ===== [추가] 슬라이더 input 이벤트와 필터 함수 연결 =====
const filterSliderEl = document.getElementById('suitabilityFilter');
const filterValueLabelEl = document.getElementById('suitabilityFilterValue');
filterSliderEl.addEventListener('input', function (e) {
  const threshold = parseFloat(e.target.value);
  filterValueLabelEl.textContent = threshold.toFixed(2);
  applySuitabilityFilter(threshold);
});
</script>
</body>
</html>
